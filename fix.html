<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>okMUSIC Core Update...</title>
    <style>
        body {
            background-color: #050505;
            color: #ffffff;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .loader {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid #F1012C; /* Trap Nation Red */
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h1 {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }
        p {
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
            max-width: 400px;
        }
        .success {
            color: #1DB954;
            display: none;
            font-weight: bold;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="loader" id="spinner"></div>
    <h1>Upgrading Core Engine...</h1>
    <p>We are forcefully destroying the old, broken offline cache. Your saved songs and settings are completely safe.</p>
    <p class="success" id="successMsg">Upgrade complete! Redirecting...</p>

    <script>
        async function nukeAndDeploy() {
            try {
                // 1. Kill the Service Worker
                if ('serviceWorker' in navigator) {
                    const regs = await navigator.serviceWorker.getRegistrations();
                    for (let reg of regs) {
                        await reg.unregister();
                        console.log("Deleted old Service Worker");
                    }
                }

                // 2. Erase the File Cache (leaves IndexedDB/LocalStorage alone)
                if ('caches' in window) {
                    const keys = await caches.keys();
                    for (let key of keys) {
                        await caches.delete(key);
                        console.log("Deleted old cache: " + key);
                    }
                }

                // Show success and redirect with a massive cache buster
                document.getElementById('spinner').style.display = 'none';
                document.getElementById('successMsg').style.display = 'block';
                
                setTimeout(() => {
                    const ts = new Date().getTime();
                    window.location.replace('./index.html?v=' + ts);
                }, 1500);

            } catch (e) {
                console.error("Nuke failed:", e);
                document.getElementById('successMsg').textContent = "Auto-upgrade failed. Please clear cache manually.";
                document.getElementById('successMsg').style.color = "#F1012C";
                document.getElementById('successMsg').style.display = 'block';
            }
        }

        // Run instantly
        window.addEventListener('load', nukeAndDeploy);
    </script>
</body>
</html>
